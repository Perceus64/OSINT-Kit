[package]
name = "osint-toolkit"
version = "0.1.0"
edition = "2021"
description = "Browser-based OSINT toolkit: domain recon, file metadata and threat-intel helpers, compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/Perceus64/osint-toolkit"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
kamadak-exif = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
